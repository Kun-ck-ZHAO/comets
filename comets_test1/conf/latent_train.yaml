# conf/latent_train.yaml — Stage 1: latent population encoder
# Usage:
#   python latent_train.py                                    # defaults
#   python latent_train.py encoder=heavy_spike loss_name=spike_dom \
#       stage1.alpha_cross=0.1 stage1.beta=0.95

defaults:
  - _self_
  - encoder: balanced

# ── Sessions ──────────────────────────────────────────────────────────────────
sessions:
  - ec013.156
  - ec013.157
  - ec013.440
  - ec013.441
  - ec013.442

data_dir: /mnt/d/comets/data/crcns_mouse

# ── Loss identity ─────────────────────────────────────────────────────────────
loss_name: only_within    # label for run dir; override in grid.sh

# ── Stage 1 ───────────────────────────────────────────────────────────────────
stage1:
  proj_dim:    8
  alpha_cross: 0.0    # only_within: no cross-modal
  beta:        0.5
  epochs:      200
  lr:          1.0e-3

# ── Sampling ──────────────────────────────────────────────────────────────────
training:
  batch_size:         256
  pos_offset:         5
  negative_mask_dist: 16

# ── Eval ──────────────────────────────────────────────────────────────────────
eval_every: 20    # eval spatial decoding every N epochs

# ── Output ────────────────────────────────────────────────────────────────────
runs_dir: runs/latent

# ── Hydra ─────────────────────────────────────────────────────────────────────
hydra:
  run:
    dir: .hydra_logs/latent/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
